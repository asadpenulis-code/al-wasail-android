
name: Build AL WASAIL APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "*.jpg"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract nested project ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | sort | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP utama tidak ditemukan!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d project

          for i in 1 2 3 4; do
            PACKAGE_FILE=$(find project \
              -type d \( -name node_modules -o -name .git \) -prune \
              -o -type f -name package.json -print | head -n 1)

            if [ -n "$PACKAGE_FILE" ]; then
              break
            fi

            INNER_ZIP=$(find project -type f -iname "*.zip" | head -n 1)

            if [ -z "$INNER_ZIP" ]; then
              echo "ERROR: package.json dan ZIP lanjutan tidak ditemukan!"
              find project -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            mkdir -p "project/extracted-$i"
            unzip -o "$INNER_ZIP" -d "project/extracted-$i"
          done

          PACKAGE_FILE=$(find project \
            -type d \( -name node_modules -o -name .git \) -prune \
            -o -type f -name package.json -print | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan setelah ekstraksi!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Install dependencies
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d node_modules/@capacitor/core ]; then
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps
          else
            CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
            npm install "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION" --legacy-peer-deps
          fi

      - name: Check Capacitor configuration
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.mjs ]; then
            echo "ERROR: Konfigurasi Capacitor tidak ditemukan!"
            exit 1
          fi

      - name: Build web project
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build --if-present

      - name: Prepare Android
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set app name AL WASAIL
        run: |
          set -e
          cd "$PROJECT_DIR"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS_FILE" ]; then
            if grep -q 'name="app_name"' "$STRINGS_FILE"; then
              sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">AL WASAIL</string>#' "$STRINGS_FILE"
            fi
          fi

      - name: Generate Al-Wasail app icon
        run: |
          set -e
          cd "$PROJECT_DIR"

          LOGO_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.png" \) | head -n 1)

          if [ -n "$LOGO_FILE" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            mkdir -p assets

            convert "$LOGO_FILE" \
              -resize 1024x1024 \
              -gravity center \
              -background white \
              -extent 1024x1024 \
              assets/icon.png

            npm install --no-save @capacitor/assets --legacy-peer-deps
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "Logo tidak ditemukan, menggunakan ikon bawaan proyek."
          fi

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-WASAIL-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
