name: Build Al-Wasail APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q ./*.zip -d project
          echo "PROJECT_DIR=$(find project -name package.json -printf '%h\n' | head -n 1)" >> $GITHUB_ENV

      - name: Install dependencies and build
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-wasail-apk
          path: "**/build/outputs/apk/debug/*.apk"
