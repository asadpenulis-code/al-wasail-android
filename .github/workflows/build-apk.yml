
name: Build Al-Wasail APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          PACKAGE_FILE=$(find project \
            -type d \( -name node_modules -o -name .git \) -prune \
            -o -type f -name package.json -print | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install dependencies
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d node_modules/@capacitor/core ]; then
            echo "Memasang Capacitor..."
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps
          else
            CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
            echo "Versi Capacitor: $CAP_VERSION"

            npm install "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION" --legacy-peer-deps
          fi

      - name: Check Capacitor configuration
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.mjs ]; then
            echo "ERROR: File konfigurasi Capacitor tidak ditemukan!"
            exit 1
          fi

          echo "Konfigurasi Capacitor ditemukan!"

      - name: Build web project
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build --if-present

      - name: Prepare Android
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Wasail-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
