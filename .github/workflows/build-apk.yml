
name: Build Al-Wasail APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          PACKAGE_FILE=$(find project -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      
      
      - name: Install dependencies and build
        run: |
          cd "$PROJECT_DIR"
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          echo "Versi esbuild:"
          npm pkg get devDependencies.esbuild
          npm install --legacy-peer-deps
          npm run build

          

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-wasail-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
